<div class="onboarding-container">
  <!-- Skip Button -->
  <button class="skip-button" (click)="skip()">
    Passer
    <span class="material-icons">arrow_forward</span>
  </button>

  <!-- Slides Container -->
  <div class="slides-wrapper">
    @for (slide of slides; track $index) {
      <div 
        class="slide"
        [class.active]="currentSlide() === $index"
        [class.prev]="currentSlide() > $index"
        [class.next]="currentSlide() < $index"
      >
        <!-- Illustration -->
        <div class="slide-illustration">
          <img [src]="slide.image" [alt]="slide.title" />
        </div>

        <!-- Content -->
        <div class="slide-content">
          <h1 class="slide-title">{{ slide.title }}</h1>
          <p class="slide-description">{{ slide.description }}</p>
        </div>
      </div>
    }
  </div>

  <!-- Navigation -->
  <div class="navigation-container">
    <!-- Previous Button -->
    <button 
      class="nav-button nav-prev"
      (click)="previousSlide()"
      [disabled]="currentSlide() === 0"
      [class.hidden]="currentSlide() === 0"
    >
      <span class="material-icons">arrow_back</span>
    </button>

    <!-- Dots Indicator -->
    <div class="dots-container">
      @for (slide of slides; track $index) {
        <button
          class="dot"
          [class.active]="currentSlide() === $index"
          (click)="goToSlide($index)"
          [attr.aria-label]="'Aller à la slide ' + ($index + 1)"
        ></button>
      }
    </div>

    <!-- Next Button -->
    <button 
      class="nav-button nav-next"
      (click)="nextSlide()"
    >
      <span class="material-icons">arrow_forward</span>
    </button>
  </div>

  <!-- Start Button (only on last slide) -->
  @if (currentSlide() === slides.length - 1) {
    <button class="start-button" (click)="finish()">
      Commencer
    </button>
  }
</div>
