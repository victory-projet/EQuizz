<div class="archive-toggle-container">
  <div class="toggle-wrapper">
    <label class="toggle-label">
      <input 
        type="checkbox" 
        class="toggle-checkbox"
        [checked]="showArchived()"
        (change)="onToggle($any($event.target).checked)"
      >
      <span class="toggle-slider"></span>
      <span class="toggle-text">
        <span class="material-icons">
          {{ showArchived() ? 'archive' : 'check_circle' }}
        </span>
        {{ getStatusText() }}
      </span>
    </label>
  </div>

  <div class="stats-summary">
    <span class="stat-item stat-total">
      <span class="material-icons">folder</span>
      Total: {{ totalCount }}
    </span>
    <span class="stat-item stat-active">
      <span class="material-icons">check_circle</span>
      Actifs: {{ activeCount }}
    </span>
    <span class="stat-item stat-archived">
      <span class="material-icons">archive</span>
      Archivés: {{ archivedCount }}
    </span>
  </div>
</div>
