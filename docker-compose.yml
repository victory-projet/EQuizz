services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: equizz_db
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_USER: user
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    secrets:
      - db_root_password
      - db_password

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=equizz_db
      - DB_USER=user
      - DB_DIALECT=mysql
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
      - jwt_secret
      - google_ai_api_key
      - firebase_service_account
      - smtp_user
      - smtp_pass

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

  mobile-student:
    build:
      context: ./mobile-student
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:8081"
      - "19000-19002:19000-19002"
    depends_on:
      - backend

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  google_ai_api_key:
    file: ./secrets/google_ai_api_key.txt
  firebase_service_account:
    file: ./secrets/firebase_service_account.json
  smtp_user:
    file: ./secrets/smtp_user.txt
  smtp_pass:
    file: ./secrets/smtp_pass.txt

volumes:
  mysql_data:
